name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege by default; the publish job widens it for itself.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # gofmt is checked rather than applied: a diff in CI is a prompt to
      # reformat locally, not something the pipeline should silently fix.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # -race matters here specifically: the agent serves SNMP on one goroutine
      # while the web UI mutates the same fault and value state from another.
      - name: go test
        run: go test -race ./...

  image:
    name: build image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built once, into the local daemon. The same image is smoke tested and
      # then pushed — rebuilding before the push would risk publishing something
      # other than what was tested.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: snmp-fault-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publishing an image that starts but does not answer would be worse than
      # publishing none, so the image is exercised before it is pushed: an
      # SNMPv3 GET, an SNMPv2c GET, and a fault driven over the HTTP surface CI
      # consumers use.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq snmp

          docker run -d --name agent -p 1161:1161/udp -p 8080:8080 snmp-fault-agent:ci
          trap 'docker logs agent; docker rm -f agent' EXIT

          ready=
          for i in $(seq 30); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "the container never became ready"
            exit 1
          fi

          echo "--- SNMPv3 authPriv GET"
          snmpget -v3 -l authPriv -u testuser -a SHA -A authpassword1 \
                  -x AES -X privpassword1 127.0.0.1:1161 1.3.6.1.2.1.1.1.0

          echo "--- SNMPv2c GET"
          snmpget -v2c -c public 127.0.0.1:1161 1.3.6.1.2.1.1.1.0

          echo "--- SET round trip"
          snmpset -v2c -c public 127.0.0.1:1161 1.3.6.1.2.1.1.4.0 s "ci@example.com"
          snmpget -v2c -c public 127.0.0.1:1161 1.3.6.1.2.1.1.4.0 | grep -q "ci@example.com"

          echo "--- non-increasing OID fault makes snmpwalk complain"
          curl -sf -X POST -d 'name=nonIncreasingOID&value=on' http://127.0.0.1:8080/faults >/dev/null
          if snmpwalk -v2c -c public 127.0.0.1:1161 1.3.6.1.2.1.1 2>&1 | grep -q "not increasing"; then
            echo "guard fired as expected"
          else
            echo "expected snmpwalk to report a non-increasing OID"
            exit 1
          fi
          curl -sf -X POST http://127.0.0.1:8080/faults/clear >/dev/null

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Tag and push the image that was just smoke tested, rather than asking
      # buildx to produce it again. A rebuild could differ from what passed.
      - name: Push image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag snmp-fault-agent:ci "$tag"
            docker push "$tag"
          done
